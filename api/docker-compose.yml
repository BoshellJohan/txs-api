services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  backend1:
    build: .
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: backend1
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend2:
    build: .
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: backend2
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend3:
    build: .
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    container_name: backend3
    env_file: ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx: 
    image: nginx:latest
    container_name: nginx
    ports: ["80:80"]
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    restart: always